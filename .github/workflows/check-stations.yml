# Checks every station link once a day and commits the result to stations.json /
# islamic_stations.json (offline flags, low bitrate links, bitrates). The app reads those
# files from this repo, so a fix reaches every user without an app update.
# Copy this folder and scripts/ to the root of the stations data repo.
name: Check stations

on:
  schedule:
    - cron: "0 5 * * *" # 06:00 in Morocco
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-stations
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check station links
        run: node scripts/check-stations.js

      - name: Commit changes
        run: |
          # status, not diff: station-status.json is a new file on the first run
          if [ -z "$(git status --porcelain)" ]; then
            echo "No change"
            exit 0
          fi
          git config user.name "station-check"
          git config user.email "station-check@users.noreply.github.com"
          git add stations.json islamic_stations.json station-status.json
          git commit -m "Daily station check"
          git push
